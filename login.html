<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fortnet - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">

                <div class="logo-icon">
                    FN
                </div>

                <div>

                    <h1>Fortnet</h1>

                    <span>
                        Cyber Defense Intelligence Platform
                    </span>

                </div>

            </div>


            <h2>Welcome Back</h2>

            <p class="auth-description">
                Sign in to your Fortnet security dashboard
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

            </form>


            <p class="switch-auth">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
