<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fortnet - Create Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">

                <div class="logo-icon">
                    FN
                </div>

                <div>
                    <h1>Fortnet</h1>

                    <span>
                        Cyber Defense Intelligence Platform
                    </span>
                </div>

            </div>


            <h2>Create Account</h2>

            <p class="auth-description">
                Create your Fortnet analyst account
            </p>


            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
